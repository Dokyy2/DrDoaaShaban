<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تحت الصيانة</title>

<style>
body{
    margin:0;
    font-family:Tahoma, Arial;
    background:#f7f8fa;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:#fff;
    padding:40px;
    border-radius:15px;
    box-shadow:0 0 25px rgba(0,0,0,.1);
    text-align:center;
    max-width:600px;
}

h1{
    color:#0d6efd;
}

p{
    color:#555;
    font-size:20px;
    line-height:1.8;
}

.small{
    margin-top:20px;
    color:#999;
}
</style>

</head>

<body>

<div class="box">
<h1>🚧 الموقع تحت التطوير والصيانة</h1>

<p>
نعمل حالياً على تطوير نظام الحجز وتحسين الخدمات.
</p>

<p>
نعتذر عن عدم إتاحة الموقع حالياً.
</p>

<p>
انتظرونا قريباً...
</p>

<div class="small">
شكراً لتفهمكم 🌹
</div>

</div>

</body>
</html>
