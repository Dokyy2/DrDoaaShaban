<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f3">
  <meta name="description" content="العيادة مغلقة مؤقتًا للتطوير. نعمل على تحسين تجربتك، انتظرونا قريبًا.">
  <title>مغلق مؤقتًا للتطوير | عيادة د. دعاء شعبان</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #173b3b;
      --muted: #617675;
      --teal: #3d7771;
      --teal-soft: #dceae5;
      --gold: #b89760;
      --paper: #f5f6f3;
      --white: #fff;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--paper); }
    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(18px, 5vw, 64px);
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(ellipse at 12% 12%, rgba(220,234,229,.72), transparent 35%),
        radial-gradient(ellipse at 90% 92%, rgba(184,151,96,.10), transparent 32%),
        var(--paper);
    }
    main {
      position: relative;
      isolation: isolate;
      width: min(100%, 860px);
      min-height: min(620px, calc(100vh - 40px));
      padding: clamp(38px, 8vw, 86px) clamp(24px, 9vw, 96px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-align: center;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(23,59,59,.10);
      border-radius: 30px;
      box-shadow: 0 28px 90px rgba(23,59,59,.10), 0 2px 10px rgba(23,59,59,.035);
    }
    main::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 12px;
      border: 1px solid rgba(184,151,96,.35);
      border-radius: 22px;
      pointer-events: none;
    }
    .brand {
      margin: 0 0 30px;
      color: var(--teal);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .ornament {
      width: 76px;
      height: 76px;
      margin-bottom: 27px;
      position: relative;
      border: 1px solid rgba(61,119,113,.28);
      border-radius: 50%;
      background: linear-gradient(145deg, #fff, #eaf2ee);
      box-shadow: 0 10px 28px rgba(61,119,113,.12);
    }
    .ornament::before, .ornament::after {
      content: "";
      position: absolute;
      border: 1px solid var(--gold);
      border-radius: 50%;
      inset: 11px;
    }
    .ornament::after { inset: 23px; border-color: rgba(61,119,113,.55); }
    .eyebrow {
      margin: 0 0 13px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .14em;
    }
    h1 {
      max-width: 650px;
      margin: 0;
      font-size: clamp(35px, 7vw, 66px);
      line-height: 1.25;
      font-weight: 750;
      letter-spacing: -.035em;
    }
    .rule {
      width: 76px;
      height: 2px;
      margin: 28px auto 24px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .message {
      max-width: 520px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(17px, 2.7vw, 21px);
      line-height: 1.9;
    }
    .wait {
      margin: 34px 0 0;
      padding: 11px 22px;
      color: var(--teal);
      border: 1px solid rgba(61,119,113,.2);
      border-radius: 999px;
      background: rgba(220,234,229,.48);
      font-size: 14px;
      font-weight: 700;
    }
    footer {
      margin-top: 46px;
      color: #869491;
      font-size: 12px;
      letter-spacing: .02em;
    }
    @media (max-width: 520px) {
      main { min-height: min(600px, calc(100svh - 36px)); border-radius: 24px; }
      main::before { inset: 9px; border-radius: 17px; }
      .brand { margin-bottom: 26px; }
      footer { margin-top: 34px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main aria-labelledby="notice-title">
    <p class="brand">عيادة د. دعاء شعبان</p>
    <div class="ornament" aria-hidden="true"></div>
    <p class="eyebrow">إشعار للزائرات</p>
    <h1 id="notice-title">مغلق مؤقتًا للتطوير</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="message">نعمل على تطوير الموقع لنقدم لكِ تجربة أفضل. نعتذر عن توقف الخدمة مؤقتًا.</p>
    <p class="wait">انتظرونا قريبًا</p>
    <footer>شكرًا لثقتكِ وتفهمكِ</footer>
  </main>
</body>
</html>
